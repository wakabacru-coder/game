<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ero Museum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&display=swap');

        :root {
            --theme-bg: #130307;
            --theme-primary: #ff4081;
            --theme-dark: #6a0b31;
            --theme-light: #ff80ab;
        }

        body {
            font-family: 'Zen Antique Soft', serif;
            background-color: var(--theme-bg);
            color: var(--theme-light);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- UI Components --- */
        .btn-erotic {
            background: linear-gradient(145deg, #2d0a15, #150308);
            border: 1px solid var(--theme-dark);
            box-shadow: 2px 2px 5px #000, -1px -1px 2px #350d1a;
            color: var(--theme-light);
            transition: all 0.1s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 50;
        }

        .btn-erotic:hover:not(.active) {
            box-shadow: 0 0 8px var(--theme-primary);
            text-shadow: 0 0 5px var(--theme-primary);
        }

        .btn-erotic:active, .btn-erotic.active {
            background: #0f0205;
            box-shadow: inset 3px 3px 6px #000, inset -1px -1px 3px #2a0a12;
            transform: translateY(1px);
            border-color: var(--theme-primary);
            color: #fff;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 10;
        }
        .screen.visible { display: flex; flex-direction: column; }

        .canvas-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .art-object {
            position: absolute;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            pointer-events: auto;
            transition: filter 0.3s;
            cursor: inherit;
        }

        .art-object.locked::before {
            content: '\f023';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            bottom: 5px;
            left: 5px;
            color: var(--theme-primary);
            font-size: 14px;
            z-index: 10;
            text-shadow: 0 0 4px #000;
        }

        /* Custom Cursors */
        .cursor-pick { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ff4081"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 3-2.74 3-2.74.53-.53 1.39-.53 1.91 0 .53.53.53 1.39 0 1.91l-4.5 4.5c-.75.75-1.8 1.13-2.88 1.05-1.55-.12-2.9-1.07-3.66-2.43L6.15 10.7c-.36-.62-.15-1.41.47-1.77.62-.36 1.41-.15 1.77.47l.61 1.06V11.24z"/></svg>') 16 16, auto !important; }
        .cursor-lock { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ff4081"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>') 16 16, auto !important; }
        .cursor-pop { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" fill="%23ff4081"><path d="M448 88.5C405 50.8 340.9 44.2 288 71.9l-22.3 11.6c-5.9 3.1-13.4 3.1-19.3 0L224 71.9C171.1 44.2 107 50.8 64 88.5 17.6 129.5 0 187.9 0 248c0 36.3 11.8 70.4 33.3 98.4l198 215.1c11.9 12.9 31.6 12.9 43.5 0l198-215.1c21.5-28 33.3-62.1 33.3-98.4 0-60.1-17.6-118.5-64-159.5zm-59.5 220l-123 133.7c-4.8 5.2-12.7 5.2-17.5 0L125 308.5c-14.8-19.2-22.7-42.5-22.7-66.5 0-40.4 12-80 43.3-107.5 28.5-25 68.8-29.4 104-11l14.7 7.7 15.6-36.5c3.2-7.5 13.7-8.1 17.8-.9l35 61.2c2.4 4.2 1.3 9.6-2.5 12.6l-38.3 30.7c-5.7 4.6-14-1.1-11.4-8L294 157.6l-20-35-18.1 42.1c-2.4 5.6-7.8 9.2-13.9 9.2H216c-6.6 0-12-5.4-12-12s5.4-12 12-12h17.1l11.4-26.6c-17.5-8.2-37.4-8.8-55.5-1.5-27.1 11-46 36.4-46 66.2 0 17.1 5.4 33.7 15.5 46.8L256 362l97.5-106c10.1-13.1 15.5-29.7 15.5-46.8 0-29.8-18.9-55.2-46-66.2-6.5-2.6-13.4-4.2-20.4-4.6l5.7-27.3c42.1 4.5 80.6 28.1 100 66.2 10.4 20.3 15.7 43 15.7 65.7 0 24-7.9 47.3-22.7 66.5z"/></svg>') 16 16, auto !important; }
        .cursor-solo { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ff4081"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>') 16 16, auto !important; }

        .ero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            mix-blend-mode: color-burn;
            pointer-events: none;
            z-index: 2;
        }

        .range-container { position: relative; width: 100%; height: 24px; }
        .range-container input[type=range] {
            position: absolute;
            width: 100%;
            pointer-events: none;
            appearance: none;
            background: none;
            z-index: 10;
        }
        .range-container input[type=range]::-webkit-slider-thumb {
            pointer-events: auto;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--theme-primary);
            cursor: pointer;
            box-shadow: 0 0 5px #000;
        }
        .range-track {
            position: absolute;
            top: 10px;
            width: 100%;
            height: 4px;
            background: #330c1a;
            border-radius: 2px;
            z-index: 1;
        }

        .shrapnel {
            position: fixed;
            pointer-events: none;
            background-size: cover;
            z-index: 9998;
            animation: shrapnel-anim 0.8s ease-out forwards;
        }
        @keyframes shrapnel-anim {
            to { transform: translate(var(--tw-x), var(--tw-y)) rotate(var(--tw-r)) scale(0); opacity: 0; }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: particle-anim 0.6s ease-out forwards;
        }
        @keyframes particle-anim {
            to { transform: translate(var(--tw-x), var(--tw-y)) scale(0); opacity: 0; }
        }

        .counter-board {
            background: #000;
            border: 2px solid var(--theme-dark);
            color: var(--theme-primary);
            font-family: monospace;
            text-shadow: 0 0 5px var(--theme-primary);
        }

        /* --- Frames --- */
        .frame-none { border: none; }
        .frame-rose { border: 6px solid #ff4081; box-shadow: inset 0 0 5px #000; }
        .frame-gold { border: 10px double #d4af37; }
        .frame-silk { border: 8px solid #4a0f20; }
        .frame-neon { border: 4px solid #ff00ff; box-shadow: 0 0 15px #ff00ff; }
        .frame-wood { border: 12px solid #2b1108; }

        /* --- Filters --- */
        .filter-none { filter: none; }
        .filter-pinky { filter: saturate(1.4) hue-rotate(-10deg) brightness(0.9); }
        .filter-deep { filter: contrast(1.3) brightness(0.7) saturate(0.8); }
        .filter-dream { filter: blur(0.5px) contrast(1.1) brightness(1.1); }
        .filter-midnight { filter: invert(0.1) contrast(1.2) brightness(0.6); }
        .filter-glitch { filter: contrast(1.5) saturate(2) hue-rotate(45deg); }

        /* --- Animations --- */
        .anim-in-kibin { animation: inKibin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes inKibin { 0% { transform: rotate(var(--rot, 0deg)) scale(0); opacity: 0; } 100% { transform: rotate(var(--rot, 0deg)) scale(1); opacity: 1; } }

        .anim-in-nettori { animation: inNettori 1s ease-out forwards; }
        @keyframes inNettori { 0% { transform: rotate(var(--rot, 0deg)) translateY(50px); opacity: 0; } 100% { transform: rotate(var(--rot, 0deg)) translateY(0); opacity: 1; } }

        .anim-in-shizuku { animation: inShizuku 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes inShizuku { 0% { transform: rotate(var(--rot, 0deg)) translateY(-100px) scaleY(1.2); opacity: 0; } 60% { transform: rotate(var(--rot, 0deg)) translateY(10px) scaleY(0.9); opacity: 1; } 100% { transform: rotate(var(--rot, 0deg)) translateY(0) scaleY(1); opacity: 1; } }

        .anim-in-fuwari { animation: inFuwari 1.2s ease-in-out forwards; }
        @keyframes inFuwari { 0% { transform: rotate(var(--rot, 0deg)) scale(0.9); opacity: 0; } 100% { transform: rotate(var(--rot, 0deg)) scale(1); opacity: 1; } }

        .anim-in-zoom { animation: inZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes inZoom { 0% { transform: rotate(var(--rot, 0deg)) scale(0.2); opacity: 0; } 100% { transform: rotate(var(--rot, 0deg)) scale(1); opacity: 1; } }

        .anim-loop-yure { animation: loopYure 3s ease-in-out infinite alternate; }
        @keyframes loopYure { from { transform: rotate(calc(var(--rot, 0deg) - 3deg)); } to { transform: rotate(calc(var(--rot, 0deg) + 3deg)); } }

        .anim-loop-kodou { animation: loopKodou 1.5s ease-in-out infinite; }
        @keyframes loopKodou { 0% { transform: rotate(var(--rot, 0deg)) scale(1); } 15% { transform: rotate(var(--rot, 0deg)) scale(1.05); } 30% { transform: rotate(var(--rot, 0deg)) scale(1); } 100% { transform: rotate(var(--rot, 0deg)) scale(1); } }

        .anim-loop-merome { animation: loopMerome 4s linear infinite; }
        @keyframes loopMerome { 0% { transform: rotate(var(--rot, 0deg)) scale(1); opacity: 1; } 50% { transform: rotate(calc(var(--rot, 0deg) + 5deg)) scale(1.02); opacity: 0.8; } 100% { transform: rotate(var(--rot, 0deg)) scale(1); opacity: 1; } }

        .anim-loop-fuwa { animation: loopFuwa 4s ease-in-out infinite alternate; }
        @keyframes loopFuwa { from { transform: rotate(var(--rot, 0deg)) translateY(-10px); } to { transform: rotate(var(--rot, 0deg)) translateY(10px); } }

        .anim-loop-spin { animation: loopSpin 12s linear infinite; }
        @keyframes loopSpin { from { transform: rotate(var(--rot, 0deg)) scale(1); } to { transform: rotate(calc(var(--rot, 0deg) + 360deg)) scale(1); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="app" class="relative w-full h-screen bg-black overflow-hidden">

        <div id="home-screen" class="screen visible items-center justify-center bg-[#130307]">
            <h1 class="text-pink-500 text-7xl font-bold mb-4 tracking-tighter drop-shadow-[0_0_15px_#ff4081]">Ero Museum</h1>
            <h2 class="text-pink-400 text-4xl font-bold mb-20 tracking-tighter drop-shadow-[0_0_10px_#ff4081]">Mode Select</h2>
            <div class="flex flex-col md:flex-row gap-8">
                <button onclick="app.changeMode('RANDOM')" class="btn-erotic w-64 h-24 text-2xl font-bold rounded-lg gap-3">
                    <i class="fa-solid fa-shuffle"></i> RANDOM
                </button>
                <button onclick="app.changeMode('GALLERY')" class="btn-erotic w-64 h-24 text-2xl font-bold rounded-lg gap-3">
                    <i class="fa-solid fa-images"></i> GALLERY
                </button>
                <button onclick="app.changeMode('SLIDESHOW')" class="btn-erotic w-64 h-24 text-2xl font-bold rounded-lg gap-3">
                    <i class="fa-solid fa-play"></i> SLIDESHOW
                </button>
            </div>
            <button onclick="app.toggleParallax()" class="btn-erotic absolute bottom-8 right-24 w-14 h-14 rounded-full text-xl active text-green-400"><i class="fa-solid fa-layer-group"></i></button>
            <button onclick="app.toggleFullscreen()" class="btn-erotic absolute bottom-8 right-8 w-14 h-14 rounded-full text-xl">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>

        <div id="random-screen" class="screen">
            <div id="random-canvas" class="canvas-area bg-[#0a0104] cursor-pick"></div>
            
            <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-50">
                <div class="pointer-events-auto">
                    <button onclick="app.toggleMenu()" class="btn-erotic w-12 h-12 rounded"><i class="fa-solid fa-bars"></i></button>
                </div>
                
                <div class="pointer-events-auto flex items-center gap-4 mx-auto">
                    <button id="play-btn" onclick="app.togglePlay()" class="btn-erotic w-28 h-12 rounded font-bold text-green-400">START</button>
                    <div class="flex gap-2 p-1 bg-[#130307] rounded-full border border-pink-900 shadow-xl">
                        <button onclick="app.setTool('PICK')" data-tool="PICK" class="tool-btn btn-erotic w-12 h-12 rounded-full active"><i class="fa-solid fa-hand-pointer"></i></button>
                        <button onclick="app.setTool('LOCK')" data-tool="LOCK" class="tool-btn btn-erotic w-12 h-12 rounded-full"><i class="fa-solid fa-lock"></i></button>
                        <button onclick="app.setTool('POP')" data-tool="POP" class="tool-btn btn-erotic w-12 h-12 rounded-full"><i class="fa-solid fa-heart-crack"></i></button>
                        <button onclick="app.setTool('SOLO')" data-tool="SOLO" class="tool-btn btn-erotic w-12 h-12 rounded-full"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <div class="pointer-events-auto flex items-center gap-2">
                    <button onclick="app.toggleGravity()" class="btn-erotic w-12 h-12 rounded"><i class="fa-solid fa-arrow-down"></i></button>
                    <button onclick="app.changeMode('HOME')" class="btn-erotic w-12 h-12 rounded"><i class="fa-solid fa-house"></i></button>
                </div>
            </div>

            <div id="side-menu" class="absolute top-0 left-0 w-80 h-full bg-[#130307f0] border-r border-pink-900 z-[60] transform -translate-x-full transition-transform duration-300 p-6 overflow-y-auto">
                <div class="flex justify-end mb-2">
                    <button onclick="app.toggleMenu()" class="text-pink-300 hover:text-white text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="counter-board w-full p-3 rounded mb-6 flex flex-col items-center">
                    <span class="text-[10px] opacity-70">DISPLAYED IMAGES</span>
                    <span id="canvas-counter" class="text-3xl font-bold italic">0000</span>
                </div>

                <div id="menu-upload" onclick="document.getElementById('file-input').click()" 
                     class="w-full h-24 mb-6 border-2 border-dashed border-pink-900 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-pink-900/20 transition-colors">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-pink-500 mb-2"></i>
                    <span class="text-[10px] text-pink-300">UPLOAD (DRAG & DROP)</span>
                </div>

                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>不透明度</span><span id="label-opacity">100%</span></div>
                        <input type="range" class="w-full accent-pink-500" min="10" max="100" value="100" oninput="app.setParam('opacity', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>表示間隔</span><span id="label-interval">1.0s</span></div>
                        <input type="range" class="w-full accent-pink-500" min="0.1" max="5.0" step="0.1" value="1.0" oninput="app.setParam('interval', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>エロ加工度</span><span id="label-ero">0%</span></div>
                        <input type="range" class="w-full accent-pink-500" min="0" max="100" value="0" oninput="app.setParam('eroDegree', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>サイズ範囲 (px)</span><span id="label-size">100 - 300</span></div>
                        <div class="range-container">
                            <div class="range-track"></div>
                            <input type="range" id="size-min" min="50" max="800" value="100" oninput="app.updateSizeRange()">
                            <input type="range" id="size-max" min="50" max="800" value="300" oninput="app.updateSizeRange()">
                        </div>
                    </div>

                    <div id="preset-groups" class="space-y-6 pt-4 border-t border-pink-900/50"></div>

                    <div class="grid grid-cols-2 gap-2 pt-4">
                        <button onclick="app.randomizeParams()" class="btn-erotic h-10 text-[10px]">RANDOMIZE</button>
                        <button onclick="app.clearCanvas()" class="btn-erotic h-10 text-[10px] text-red-400">CLEAR ALL</button>
                    </div>
                </div>
            </div>

            <button onclick="app.toggleParallax()" class="btn-erotic absolute bottom-4 right-20 w-12 h-12 rounded-full active text-green-400"><i class="fa-solid fa-layer-group"></i></button>
            <button onclick="app.toggleFullscreen()" class="btn-erotic absolute bottom-4 right-4 w-12 h-12 rounded-full"><i class="fa-solid fa-expand"></i></button>
        </div>

        <div id="gallery-screen" class="screen">
            <div id="gallery-canvas" class="canvas-area bg-[#070103] cursor-pick"></div>
            <button onclick="app.toggleGravity()" class="btn-erotic absolute top-4 right-20 w-12 h-12 rounded z-50"><i class="fa-solid fa-arrow-down"></i></button>
            <button onclick="app.changeMode('HOME')" class="btn-erotic absolute top-4 right-4 w-12 h-12 rounded z-50"><i class="fa-solid fa-house"></i></button>
            
            <button onclick="app.toggleParallax()" class="btn-erotic absolute top-20 right-20 w-12 h-12 rounded z-50 active text-green-400"><i class="fa-solid fa-layer-group"></i></button>
            <button onclick="app.toggleFullscreen()" class="btn-erotic absolute top-20 right-4 w-12 h-12 rounded z-50"><i class="fa-solid fa-expand"></i></button>

            <div id="gallery-palette-container" class="absolute bottom-0 left-0 w-full h-24 bg-[#130307e6] border-t border-pink-900 flex items-center px-4 gap-3 z-50 overflow-x-auto transition-transform duration-300">
                <button onclick="app.togglePalette('gallery')" class="absolute top-1 right-2 text-pink-500 hover:text-white z-[60] text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
                <button onclick="document.getElementById('file-input').click()" class="palette-item w-[70px] h-[70px] flex flex-col items-center justify-center bg-[#2d0a15] text-pink-500 shrink-0 border border-pink-900">
                    <i class="fa-solid fa-plus text-xl"></i>
                    <span class="text-[8px]">UPLOAD</span>
                </button>
                <div id="palette-list" class="flex gap-2"></div>
            </div>
            <button id="gallery-palette-open" onclick="app.togglePalette('gallery')" class="btn-erotic absolute bottom-4 right-4 w-12 h-12 rounded-full z-[60] hidden"><i class="fa-solid fa-palette"></i></button>
        </div>

        <div id="slideshow-screen" class="screen">
            <div id="slideshow-canvas" class="canvas-area bg-[#0a0104] flex items-center justify-center"></div>
            
            <button onclick="app.toggleGravity()" class="btn-erotic absolute top-4 right-20 w-12 h-12 rounded z-50"><i class="fa-solid fa-arrow-down"></i></button>
            <button onclick="app.changeMode('HOME')" class="btn-erotic absolute top-4 right-4 w-12 h-12 rounded z-50"><i class="fa-solid fa-house"></i></button>
            
            <button onclick="app.toggleParallax()" class="btn-erotic absolute top-20 right-20 w-12 h-12 rounded z-50 active text-green-400"><i class="fa-solid fa-layer-group"></i></button>
            <button onclick="app.toggleFullscreen()" class="btn-erotic absolute top-20 right-4 w-12 h-12 rounded z-50"><i class="fa-solid fa-expand"></i></button>
            
            <div id="slideshow-controls" class="absolute top-4 left-4 flex gap-4 z-50 transition-transform duration-300">
                <button onclick="app.toggleMenuSlideshow()" class="btn-erotic w-12 h-12 rounded"><i class="fa-solid fa-bars"></i></button>
                <button id="slideshow-play-btn" onclick="app.toggleSlideshowPlay()" class="btn-erotic w-28 h-12 rounded font-bold text-green-400">START</button>
            </div>

            <div id="slideshow-side-menu" class="absolute top-0 left-0 w-80 h-[calc(100%-6rem)] bg-[#130307f0] border-r border-pink-900 z-[60] transform -translate-x-full transition-transform duration-300 p-6 overflow-y-auto">
                <div class="flex justify-end mb-2">
                    <button onclick="app.toggleMenuSlideshow()" class="text-pink-300 hover:text-white text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>表示間隔</span><span id="label-slide-interval">3.0s</span></div>
                        <input type="range" class="w-full accent-pink-500" min="0.1" max="10.0" step="0.1" value="3.0" oninput="app.setSlideParam('interval', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-2"><span>エロ加工度</span><span id="label-slide-ero">0%</span></div>
                        <input type="range" class="w-full accent-pink-500" min="0" max="100" value="0" oninput="app.setSlideParam('eroDegree', this.value)">
                    </div>

                    <div id="slide-preset-groups" class="space-y-6 pt-4 border-t border-pink-900/50"></div>
                </div>
            </div>

            <div id="slideshow-palette-container" class="absolute bottom-0 left-0 w-full h-24 bg-[#130307e6] border-t border-pink-900 flex items-center px-4 gap-3 z-50 overflow-x-auto transition-transform duration-300">
