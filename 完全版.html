        </div>

        <div id="solo-screen" class="screen bg-black">
            <button onclick="app.exitSolo()" class="btn-erotic absolute top-4 right-4 w-12 h-12 rounded z-[80] text-red-500 border-red-900">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <div class="flex h-full w-full">
                <div class="w-80 bg-[#130307] border-r border-pink-900 p-6 flex flex-col z-[70]">
                    <h2 class="text-xl font-bold text-pink-500 mb-8">SOLO EDIT</h2>
                    
                    <div class="mb-6 pb-6 border-b border-pink-900/50">
                        <div class="flex justify-between text-[10px] mb-2"><span>エロ加工度</span><span id="label-solo-ero">0%</span></div>
                        <input type="range" id="solo-ero-input" class="w-full accent-pink-500" min="0" max="100" value="0" oninput="app.setSoloEro(this.value)">
                    </div>

                    <div id="solo-presets" class="space-y-6 flex-1 overflow-y-auto pr-2"></div>
                </div>
                <div id="solo-viewport" class="flex-1 relative flex items-center justify-center overflow-hidden">
                    <div id="solo-img-container" class="relative transition-transform duration-100 ease-out origin-center"></div>
                </div>
            </div>

            <button onclick="app.toggleParallax()" class="btn-erotic absolute bottom-4 right-20 w-12 h-12 rounded-full z-[80] active text-green-400"><i class="fa-solid fa-layer-group"></i></button>
            <button onclick="app.toggleFullscreen()" class="btn-erotic absolute bottom-4 right-4 w-12 h-12 rounded-full z-[80]"><i class="fa-solid fa-expand"></i></button>
        </div>

    </div>

    <input type="file" id="file-input" class="hidden" multiple accept="image/*,video/*,audio/*" onchange="app.handleFiles(this.files)">

    <script>
        const app = {
            mode: 'HOME',
            prevMode: 'HOME',
            isPlaying: false,
            images: [],
            params: {
                opacity: 100, interval: 1000, sizeMin: 100, sizeMax: 300, eroDegree: 0,
                filter: 'filter-none', frame: 'frame-none', animIn: 'none', animLoop: 'none'
            },
            slideParams: {
                opacity: 100, interval: 3000, eroDegree: 0,
                filter: 'filter-none', frame: 'frame-none', animIn: 'none', animLoop: 'none'
            },
            currentTool: 'PICK',
            intervalId: null,
            slideIntervalId: null,
            isSlidePlaying: false,
            slideIndex: 0,
            zIndexCounter: 100,
            soloTarget: null,
            soloZoom: 1,
            burstInterval: null,
            mx: 0, my: 0,

            // --- 追加プロパティ ---
            gravityEnabled: false,
            parallaxEnabled: true,
            parallaxX: 0, parallaxY: 0, targetParallaxX: 0, targetParallaxY: 0,
            audioCtx: null, analyser: null, dataArray: null, bgmAudio: null,

            init() {
                this.renderPresets('preset-groups', true, false);
                this.renderPresets('slide-preset-groups', true, true);
                this.setupCoreEvents();
                this.updateCounter();
                this.setTool('PICK');

                this.setupAudio();
                this.startEngine();
            },

            // --- 新規追加・修正メソッド群 ---
            toggleParallax() {
                this.parallaxEnabled = !this.parallaxEnabled;
                document.querySelectorAll('.fa-layer-group').forEach(icon => {
                    if (this.parallaxEnabled) {
                        icon.parentElement.classList.add('active', 'text-green-400');
                    } else {
                        icon.parentElement.classList.remove('active', 'text-green-400');
                    }
                });
                if(!this.parallaxEnabled) {
                    this.parallaxX = 0; this.parallaxY = 0;
                    this.targetParallaxX = 0; this.targetParallaxY = 0;
                }
            },

            toggleGravity() {
                this.gravityEnabled = !this.gravityEnabled;
                document.querySelectorAll('.fa-arrow-down').forEach(icon => {
                    if (this.gravityEnabled) {
                        icon.parentElement.classList.add('active', 'text-green-400');
                    } else {
                        icon.parentElement.classList.remove('active', 'text-green-400');
                    }
                });
            },

            setupAudio() {
                this.bgmAudio = new Audio();
                this.bgmAudio.loop = true;
            },

            initAudioReactive(file) {
                if(!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    const source = this.audioCtx.createMediaElementSource(this.bgmAudio);
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                }
                if(this.audioCtx.state === 'suspended') this.audioCtx.resume();
                this.bgmAudio.src = URL.createObjectURL(file);
                this.bgmAudio.play();
            },

            playPopSound() {
                if(!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = this.audioCtx;
                if(ctx.state === 'suspended') ctx.resume();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000 + Math.random()*500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
                
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(2000 + Math.random()*1000, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
                gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc2.start();
                osc2.stop(ctx.currentTime + 0.2);
            },

            playBounceSound(velocity) {
                if(!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = this.audioCtx;
                if(ctx.state === 'suspended') ctx.resume();
                
                const vol = Math.min(1, Math.abs(velocity) / 30) * 0.4;
                if (vol < 0.01) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random()*40, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            },

            triggerJiggle(el) {
                el._jiggleTime = 400; 
            },

            startEngine() {
                // パララックス用イベント
                document.addEventListener('mousemove', (e) => {
                    this.targetParallaxX = (e.clientX - window.innerWidth / 2) / window.innerWidth;
                    this.targetParallaxY = (e.clientY - window.innerHeight / 2) / window.innerHeight;
                });
                window.addEventListener('deviceorientation', (e) => {
                    if(e.gamma && e.beta) {
                        this.targetParallaxX = Math.max(-1, Math.min(1, e.gamma / 45));
                        this.targetParallaxY = Math.max(-1, Math.min(1, (e.beta - 45) / 45));
                    }
                });

                const loop = () => {
                    // パララックスの補間
                    if (this.parallaxEnabled) {
                        this.parallaxX += (this.targetParallaxX - this.parallaxX) * 0.1;
                        this.parallaxY += (this.targetParallaxY - this.parallaxY) * 0.1;
                    }

                    // オーディオの低音（ベース）抽出
                    let bass = 0;
                    if(this.analyser) {
                        this.analyser.getByteFrequencyData(this.dataArray);
                        bass = (this.dataArray[0] + this.dataArray[1] + this.dataArray[2]) / 3;
                    }
                    const audioScale = 1 + (bass / 255) * 0.15;

                    const elements = Array.from(document.querySelectorAll('.canvas-area .art-object'));

                    // 第一段階：重力と移動の計算
                    elements.forEach(el => {
                        if(el._vy === undefined) el._vy = 0;
                        if(el._vx === undefined) el._vx = 0;
                        
                        const isDragging = (el.style.zIndex === '100000');
                        
                        // 重力による位置更新（ドラッグ中ではない要素のみ）
                        if(this.gravityEnabled && !isDragging) {
                            if(el.style.position !== 'absolute') {
                                el.style.left = el.offsetLeft + 'px';
                                el.style.top = el.offsetTop + 'px';
                                el.style.position = 'absolute';
                            }
                            el._vy += 0.5; // 重力
                            el._vx *= 0.95; // 空気抵抗・摩擦
                            
                            let top = parseFloat(el.style.top) || 0;
                            let left = parseFloat(el.style.left) || 0;
                            
                            top += el._vy;
                            left += el._vx;
                            
                            const h = parseFloat(el.style.height) || el.offsetHeight || 0;
                            const w = parseFloat(el.style.width) || el.offsetWidth || 0;
                            
                            // 壁との衝突判定（パララックスの表示位置を加味して見えない壁を解消）
                            const px = el._px || 0;
                            const py = el._py || 0;
                            const visualLeft = left + px;
                            const visualTop = top + py;

                            // 画面端の壁との衝突
                            if (visualLeft < 0) { 
                                left = -px; 
                                el._vx *= -0.7; 
                            } else if (visualLeft + w > window.innerWidth) { 
                                left = window.innerWidth - w - px; 
                                el._vx *= -0.7; 
                            }

                            // 床との衝突
                            if(visualTop + h > window.innerHeight) {
                                top = window.innerHeight - h - py;
                                el._vy *= -0.7; // 跳ね返り
                                el._vx *= 0.8; // 床の摩擦
                                if(Math.abs(el._vy) > 2) {
                                    this.triggerJiggle(el);
                                    this.playBounceSound(el._vy);
                                }
                            }
                            el.style.top = top + 'px';
                            el.style.left = left + 'px';
                        }
                    });

                    // 第二段階：衝突判定と位置の補正 (相互干渉)
                    if (this.gravityEnabled) {
                        for(let iter = 0; iter < 2; iter++) {
                            for (let i = 0; i < elements.length; i++) {
                                const el1 = elements[i];
                                const isDrag1 = (el1.style.zIndex === '100000');

                                let t1 = parseFloat(el1.style.top) || 0;
                                let l1 = parseFloat(el1.style.left) || 0;
                                const w1 = parseFloat(el1.style.width) || el1.offsetWidth || 0;
                                const h1 = parseFloat(el1.style.height) || el1.offsetHeight || 0;
                                // 当たり判定精度の向上：描画位置ベースで中心点を計算
                                const cx1 = l1 + w1/2 + (el1._px || 0);
                                const cy1 = t1 + h1/2 + (el1._py || 0);

                                for (let j = i + 1; j < elements.length; j++) {
                                    const el2 = elements[j];
                                    const isDrag2 = (el2.style.zIndex === '100000');

                                    // 両方とも掴んでいる状態なら互いに干渉しない
                                    if (isDrag1 && isDrag2) continue;

                                    let t2 = parseFloat(el2.style.top) || 0;
                                    let l2 = parseFloat(el2.style.left) || 0;
                                    const w2 = parseFloat(el2.style.width) || el2.offsetWidth || 0;
                                    const h2 = parseFloat(el2.style.height) || el2.offsetHeight || 0;
                                    const cx2 = l2 + w2/2 + (el2._px || 0);
                                    const cy2 = t2 + h2/2 + (el2._py || 0);

                                    // AABB衝突判定 (中心間距離)
                                    const dx = cx2 - cx1;
                                    const dy = cy2 - cy1;
                                    const overlapX = (w1 + w2) / 2 - Math.abs(dx);
                                    const overlapY = (h1 + h2) / 2 - Math.abs(dy);

                                    if (overlapX > 0 && overlapY > 0) {
                                        if (overlapX < overlapY) {
                                            // 左右の衝突
                                            if (isDrag1) {
                                                const pushX = overlapX;
                                                if (dx > 0) l2 += pushX; else l2 -= pushX;
                                                el2._vx = (el2._vx - el1._vx) * 0.6; // 弾き飛ばす
                                            } else if (isDrag2) {
                                                const pushX = overlapX;
                                                if (dx > 0) l1 -= pushX; else l1 += pushX;
                                                el1._vx = (el1._vx - el2._vx) * 0.6;
                                            } else {
                                                const pushX = overlapX / 2;
                                                if (dx > 0) { l1 -= pushX; l2 += pushX; } 
                                                else { l1 += pushX; l2 -= pushX; }
                                                
                                                const v1x = el1._vx;
                                                el1._vx = el2._vx * 0.6;
                                                el2._vx = v1x * 0.6;
                                            }
                                        } else {
                                            // 上下の衝突
                                            if (isDrag1) {
                                                const pushY = overlapY;
                                                if (dy > 0) t2 += pushY; else t2 -= pushY;
                                                el2._vy = (el2._vy - el1._vy) * 0.6;
                                            } else if (isDrag2) {
                                                const pushY = overlapY;
                                                if (dy > 0) t1 -= pushY; else t1 += pushY;
                                                el1._vy = (el1._vy - el2._vy) * 0.6;
                                            } else {
                                                const pushY = overlapY / 2;
                                                if (dy > 0) { t1 -= pushY; t2 += pushY; } 
                                                else { t1 += pushY; t2 -= pushY; }

                                                const relVy = Math.abs(el1._vy - el2._vy);
                                                if (relVy > 2 && iter === 0) {
                                                    this.triggerJiggle(el1);
                                                    this.triggerJiggle(el2);
                                                    this.playBounceSound(relVy);
                                                }

                                                const v1y = el1._vy;
                                                el1._vy = el2._vy * 0.6;
                                                el2._vy = v1y * 0.6;
                                            }
                                        }
                                        el1.style.left = l1 + 'px'; el1.style.top = t1 + 'px';
                                        el2.style.left = l2 + 'px'; el2.style.top = t2 + 'px';
                                    }
                                }
                            }
                        }
                    }

                    // 第三段階：見た目の更新（アニメーション、パララックスなど）
                    elements.forEach(el => {
                        // ぷるぷる（Soft Body）アニメーション
                        if(el._jiggleTime > 0) {
                            el._jiggleTime -= 16;
                            let prog = 1 - (el._jiggleTime / 400);
                            if(prog >= 1) { el._jsx = 1; el._jsy = 1; el._jiggleTime = 0; }
                            else {
                                let damp = 1 - prog;
                                el._jsx = 1 + Math.sin(prog * Math.PI * 6) * 0.1 * damp;
                                el._jsy = 1 - Math.sin(prog * Math.PI * 6) * 0.1 * damp;
                            }
                        } else {
                            el._jsx = 1; el._jsy = 1;
                        }

                        // 変形の合成
                        const rot = el.style.getPropertyValue('--rot') || '0deg';
                        let depth = (parseInt(el.style.zIndex) || 100) - 100;
                        
                        // Pickで掴んでいる要素はカーソル追従を正確にするため一時的にパララックス無効化
                        if (el.style.zIndex === '100000') {
                            el._px = 0;
                            el._py = 0;
                        } else {
                            el._px = this.parallaxX * depth * 0.7;
                            el._py = this.parallaxY * depth * 0.7;
                        }
                        
                        const finalSx = (el._jsx || 1) * audioScale;
                        const finalSy = (el._jsy || 1) * audioScale;

                        el.style.transform = `translate(${el._px}px, ${el._py}px) rotate(${rot}) scale(${finalSx}, ${finalSy})`;
                        
                        if(this.analyser && el.classList.contains('frame-neon')) {
                            el.style.boxShadow = `0 0 ${15 + (bass/255)*40}px #ff00ff, inset 0 0 ${10 + (bass/255)*20}px #ff00ff`;
                        }
                    });

                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            },
            // --- 追加処理ここまで ---

            getPresetConfig() {
                return {
                    filter: { title: 'エフェクト', opts: ['filter-pinky', 'filter-deep', 'filter-dream', 'filter-midnight', 'filter-glitch', 'filter-none'], 
                             names: ['桃酔', '淫夜', '白昼夢', '月蝕', '乱躁', 'OFF'] },
                    frame: { title: 'フレーム', opts: ['frame-rose', 'frame-gold', 'frame-silk', 'frame-neon', 'frame-wood', 'frame-none'], 
                             names: ['薔薇', '金細工', '緋絹', '淫光', '骨董', 'OFF'] },
                    animIn: { title: 'インアニメ', opts: ['anim-in-kibin', 'anim-in-nettori', 'anim-in-shizuku', 'anim-in-fuwari', 'anim-in-zoom', 'none'], 
                              names: ['機敏', 'ねっとり', '雫', 'ふわり', '迫り', 'OFF'] },
                    animLoop: { title: 'ループアニメ', opts: ['anim-loop-yure', 'anim-loop-kodou', 'anim-loop-merome', 'anim-loop-fuwa', 'anim-loop-spin', 'none'], 
                               names: ['揺らぎ', '鼓動', '目眩', '浮遊', '回転', 'OFF'] }
                };
            },

            renderPresets(containerId, includeAnims, isSlideshow = false) {
                const config = this.getPresetConfig();
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                const targetParams = isSlideshow ? this.slideParams : this.params;
                
                Object.keys(config).forEach(key => {
                    if (!includeAnims && (key === 'animIn' || key === 'animLoop')) return;
                    const group = config[key];
                    const div = document.createElement('div');
                    div.innerHTML = `<h3 class="text-[10px] text-pink-400 font-bold mb-3">${group.title}</h3>`;
                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-2 gap-2';
                    group.opts.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = `btn-erotic h-9 text-[10px] rounded ${targetParams[key] === opt ? 'active' : ''}`;
                        btn.innerText = group.names[idx];
                        btn.onclick = () => {
                            Array.from(grid.children).forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            targetParams[key] = opt;
                            if(this.mode === 'SOLO' && !isSlideshow) this.applySoloChanges();
                        };
                        grid.appendChild(btn);
                    });
                    div.appendChild(grid);
                    container.appendChild(div);
                });
            },

            changeMode(m) {
                if (this.mode !== 'SOLO') this.prevMode = this.mode;
                if(this.mode === 'RANDOM' && m !== 'SOLO') this.togglePlay(false);
                if(this.mode === 'SLIDESHOW' && m !== 'SOLO') this.toggleSlideshowPlay(false);
                
                this.mode = m;
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
                document.getElementById(`${m.toLowerCase()}-screen`).classList.add('visible');
            },

            togglePlay(force) {
                this.isPlaying = (force !== undefined) ? force : !this.isPlaying;
                const btn = document.getElementById('play-btn');
                if (this.isPlaying) {
                    if (this.images.length === 0) { this.isPlaying = false; return; }
                    btn.innerText = "STOP"; 
                    btn.classList.remove('text-green-400');
                    btn.classList.add('text-red-500'); 
                    btn.style.color = '#ef4444';
                    btn.classList.add('active');
                    this.startInterval();
                } else {
                    btn.innerText = "START"; 
                    btn.classList.remove('text-red-500'); 
                    btn.style.color = '';
                    btn.classList.add('text-green-400'); 
                    btn.classList.remove('active');
                    clearInterval(this.intervalId);
                }
            },

            startInterval() {
                clearInterval(this.intervalId);
                this.intervalId = setInterval(() => this.spawnImage(), this.params.interval);
            },

            updateCounter() {
                const count = document.getElementById('random-canvas').children.length;
                document.getElementById('canvas-counter').innerText = count.toString().padStart(4, '0');
            },

            spawnImage() {
                if(this.images.length === 0) return;
                const src = this.images[Math.floor(Math.random() * this.images.length)];
                const isVideo = src.startsWith('data:video');
                
                const processMedia = (wOrig, hOrig, mediaEl) => {
                    const aspect = wOrig / hOrig;
                    const baseSize = Math.random() * (this.params.sizeMax - this.params.sizeMin) + this.params.sizeMin;
                    let w, h;
                    if(aspect >= 1) { w = baseSize; h = baseSize / aspect; }
                    else { h = baseSize; w = baseSize * aspect; }

                    const obj = document.createElement('div');
                    obj.className = `art-object ${this.params.frame} ${this.params.filter}`;
                    const x = Math.random() * (window.innerWidth - w);
                    const y = Math.random() * (window.innerHeight - h);
                    const rot = (Math.random() * 20) - 10;

                    Object.assign(obj.style, {
                        width: w + 'px', height: h + 'px', left: x + 'px', top: y + 'px',
                        zIndex: this.zIndexCounter++, opacity: this.params.opacity / 100
                    });
                    
                    if(!isVideo) {
                        obj.style.backgroundImage = `url(${src})`;
                    } else {
                        mediaEl.style.width = '100%'; mediaEl.style.height = '100%'; 
                        mediaEl.style.objectFit = 'cover'; mediaEl.style.pointerEvents = 'none';
                        mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true;
                        obj.appendChild(mediaEl);
                    }

                    obj.style.setProperty('--rot', `${rot}deg`);
                    obj.style.transform = `rotate(${rot}deg)`;

                    if (this.params.animIn !== 'none') {
                        obj.classList.add(this.params.animIn);
                        obj.addEventListener('animationend', (e) => {
                            if (e.animationName.startsWith('in')) obj.classList.add(this.params.animLoop);
                        }, { once: true });
                    } else {
                        obj.classList.add(this.params.animLoop);
                    }

                    const overlay = document.createElement('div');
                    overlay.className = 'ero-overlay';
                    const p = this.params.eroDegree / 100;
                    overlay.style.backgroundColor = `rgba(255, 20, 100, ${p})`;
                    overlay.style.display = p > 0 ? 'block' : 'none';
                    obj.appendChild(overlay);

                    this.attachEvents(obj);
                    document.getElementById('random-canvas').appendChild(obj);
                    this.updateCounter();
                    
                    if(document.getElementById('random-canvas').children.length > 1000) {
                        document.getElementById('random-canvas').firstChild.remove();
                        this.updateCounter();
                    }
                };

                if(isVideo) {
                    const vid = document.createElement('video');
                    vid.src = src;
                    vid.onloadedmetadata = () => processMedia(vid.videoWidth, vid.videoHeight, vid);
                } else {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => processMedia(img.width, img.height, null);
                }
            },

            attachEvents(el) {
                let lastTapTime = 0;
                
                el.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;
                    if (tapLength < 300 && tapLength > 0) {
                        if(this.currentTool === 'PICK' || this.currentTool === 'SOLO') {
                            this.enterSolo(el);
                            e.preventDefault();
                            return;
                        }
                    }
                    lastTapTime = currentTime;

                    if(this.currentTool === 'LOCK') { el.classList.toggle('locked'); return; }
                    if(el.classList.contains('locked') && this.currentTool === 'POP') return;

                    if(this.currentTool === 'POP') { this.burstEffect(el, e.clientX, e.clientY); return; }
                    if(this.currentTool === 'SOLO') { this.enterSolo(el); return; }
                    if(this.currentTool === 'PICK') this.startDrag(e, el);
                });

                // ピンチズーム対応 (Touch events)
                let initialDistance = null;
                let initialWidth = null;
                let initialHeight = null;
                let initialLeft = null;
                let initialTop = null;

                el.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2 && this.currentTool === 'PICK') {
                        initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        initialWidth = parseFloat(el.style.width);
                        initialHeight = parseFloat(el.style.height);
                        initialLeft = parseFloat(el.style.left);
                        initialTop = parseFloat(el.style.top);
                    }
                }, {passive: false});

                el.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && this.currentTool === 'PICK' && initialDistance) {
                        e.preventDefault();
                        const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        const scaleChange = currentDistance / initialDistance;
                        
                        const newWidth = initialWidth * scaleChange;
                        const newHeight = initialHeight * scaleChange;
                        const dx = (newWidth - initialWidth) / 2;
                        const dy = (newHeight - initialHeight) / 2;
                        
                        el.style.width = newWidth + 'px';
                        el.style.height = newHeight + 'px';
                        el.style.left = (initialLeft - dx) + 'px';
                        el.style.top = (initialTop - dy) + 'px';
                    }
                }, {passive: false});

                el.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        initialDistance = null;
                    }
                });

                el.addEventListener('wheel', (e) => {
                    if(this.mode === 'SOLO') return;
                    if(this.currentTool !== 'PICK') return;
                    e.preventDefault();
                    const scaleChange = e.deltaY < 0 ? 1.05 : 0.95;
                    const rect = el.getBoundingClientRect();
                    
                    const w = parseFloat(el.style.width);
                    const h = parseFloat(el.style.height);
                    const newWidth = w * scaleChange;
                    const newHeight = h * scaleChange;
                    
                    const dx = (newWidth - w) / 2;
                    const dy = (newHeight - h) / 2;
                    
                    el.style.width = newWidth + 'px';
                    el.style.height = newHeight + 'px';
                    el.style.left = (parseFloat(el.style.left || rect.left) - dx) + 'px';
                    el.style.top = (parseFloat(el.style.top || rect.top) - dy) + 'px';
                }, {passive: false});
            },

            burstEffect(el, x, y) {
                this.playPopSound(); 
                const rect = el.getBoundingClientRect();
                const src = el.style.backgroundImage !== '' ? el.style.backgroundImage : 'none';
                
                const b = document.createElement('div');
                b.className = 'fixed pointer-events-none z-[10000] text-pink-500 text-3xl';
                b.innerHTML = '<i class="fa-solid fa-heart-crack"></i>';
                b.style.left = x+'px'; b.style.top = y+'px';
                b.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(b);
                let s = 1, o = 1;
                const heartAnim = setInterval(() => {
                    s += 0.4; o -= 0.1;
                    b.style.transform = `translate(-50%, -50%) scale(${s})`;
                    b.style.opacity = o;
                    if(o<=0) { clearInterval(heartAnim); b.remove(); }
                }, 30);

                if(src !== 'none') {
                    const rows = 3, cols = 3;
                    const sw = rect.width / cols;
                    const sh = rect.height / rows;
                    for(let r=0; r<rows; r++) {
                        for(let c=0; c<cols; c++) {
                            const frag = document.createElement('div');
                            frag.className = 'shrapnel';
                            Object.assign(frag.style, {
                                width: sw + 'px', height: sh + 'px',
                                left: (rect.left + c * sw) + 'px',
                                top: (rect.top + r * sh) + 'px',
                                backgroundImage: src,
                                backgroundPosition: `${-c * sw}px ${-r * sh}px`,
                                backgroundSize: `${rect.width}px ${rect.height}px`
                            });
                            const angle = Math.random() * Math.PI * 2;
                            const dist = 100 + Math.random() * 200;
                            frag.style.setProperty('--tw-x', Math.cos(angle) * dist + 'px');
                            frag.style.setProperty('--tw-y', Math.sin(angle) * dist + 'px');
                            frag.style.setProperty('--tw-r', (Math.random() * 360) + 'deg');
                            document.body.appendChild(frag);
                            setTimeout(() => frag.remove(), 800);
                        }
                    }
                }

                for(let i=0; i<10; i++){
                    const p = document.createElement('div');
                    p.className = 'particle w-2 h-2 bg-pink-400 rounded-full';
                    const angle = (Math.PI * 2 / 10) * i;
                    const dist = 60 + Math.random() * 60;
                    p.style.left = x + 'px';
                    p.style.top = y + 'px';
                    p.style.setProperty('--tw-x', Math.cos(angle) * dist + 'px');
                    p.style.setProperty('--tw-y', Math.sin(angle) * dist + 'px');
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 600);
                }

                el.remove();
                this.updateCounter();
            },

            startDrag(e, el) {
                const rect = el.getBoundingClientRect();
                const offset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                el.style.zIndex = 100000;
                
                const move = (ev) => { 
                    const newLeft = ev.clientX - offset.x;
                    const newTop = ev.clientY - offset.y;
                    
                    // ドラッグでの勢いを物理エンジンに伝えるための速度計算
                    el._vx = newLeft - (parseFloat(el.style.left) || newLeft);
                    el._vy = newTop - (parseFloat(el.style.top) || newTop);
                    
                    el.style.left = newLeft + 'px'; 
                    el.style.top = newTop + 'px'; 
                };
                const up = () => { 
                    el.style.zIndex = this.zIndexCounter++; 
                    document.removeEventListener('pointermove', move); 
                    document.removeEventListener('pointerup', up); 
                    this.triggerJiggle(el); 
                };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
            },

            enterSolo(target) {
                this.togglePlay(false);
                this.soloTarget = target;
                const canvasId = this.prevMode === 'RANDOM' ? 'random-canvas' : 'gallery-canvas';
                Array.from(document.getElementById(canvasId).children).forEach(c => c.style.visibility = 'hidden');
                target.style.visibility = 'visible';

                const overlay = target.querySelector('.ero-overlay');
                const currentEro = overlay ? (parseFloat(overlay.style.backgroundColor.split(',')[3]) * 100 || 0) : 0;
                document.getElementById('solo-ero-input').value = currentEro;
                document.getElementById('label-solo-ero').innerText = Math.round(currentEro) + '%';

                this.changeMode('SOLO');
                this.renderPresets('solo-presets', false, false);
                this.soloZoom = 1;
                const container = document.getElementById('solo-img-container');
                container.innerHTML = '';
                const clone = target.cloneNode(true);
                clone.className = `art-object ${this.params.frame} ${this.params.filter}`;
                Object.assign(clone.style, { position: 'relative', left: '0', top: '0', transform: 'none' });
                container.appendChild(clone);
                container.style.transform = 'scale(1)';
            },

            setSoloEro(v) {
                if(!this.soloTarget) return;
                const p = v / 100;
                document.getElementById('label-solo-ero').innerText = v + '%';
                const overlay = this.soloTarget.querySelector('.ero-overlay');
                const cloneOverlay = document.getElementById('solo-img-container').firstChild.querySelector('.ero-overlay');
                [overlay, cloneOverlay].forEach(o => {
                    if (o) {
                        o.style.backgroundColor = `rgba(255, 20, 100, ${p})`;
                        o.style.display = p > 0 ? 'block' : 'none';
                    }
                });
            },

            applySoloChanges() {
                if(!this.soloTarget) return;
                const soloImg = document.getElementById('solo-img-container').firstChild;
                const config = this.getPresetConfig();
                Object.keys(config).forEach(k => {
                    config[k].opts.forEach(opt => {
                        soloImg.classList.remove(opt);
                        this.soloTarget.classList.remove(opt);
                    });
                });
                soloImg.classList.add(this.params.filter, this.params.frame);
                this.soloTarget.classList.add(this.params.filter, this.params.frame);
            },

            exitSolo() {
                const canvasId = this.prevMode === 'RANDOM' ? 'random-canvas' : 'gallery-canvas';
                Array.from(document.getElementById(canvasId).children).forEach(c => c.style.visibility = 'visible');
                this.changeMode(this.prevMode);
            },

            handleFiles(files) {
                Array.from(files).forEach(f => {
                    if(f.type.startsWith('audio/')) {
                        this.initAudioReactive(f);
                        return; 
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => { 
                        this.images.push(e.target.result); 
                        this.addPalette(e.target.result); 
                    };
                    reader.readAsDataURL(f);
                });
            },

            addPalette(src) {
                const isVideo = src.startsWith('data:video');
                const thumbnail = isVideo ? 'https://via.placeholder.com/70x70/2d0a15/ff4081?text=VIDEO' : `url(${src})`;

                const createItem = (targetId, isGallery) => {
                    const div = document.createElement('div');
                    div.className = 'palette-item w-[70px] h-[70px] bg-cover bg-center shrink-0 border border-pink-900 rounded cursor-pointer';
                    div.style.backgroundImage = thumbnail;
                    
                    if (isGallery) {
                        div.classList.add('cursor-grab');
                        div.addEventListener('pointerdown', (e) => {
                            if(e.button === 2) return;
                            const ghost = div.cloneNode(true);
                            Object.assign(ghost.style, { position: 'fixed', zIndex: 10000, pointerEvents: 'none' });
                            document.body.appendChild(ghost);
                            const move = (ev) => { ghost.style.left = (ev.clientX - 35) + 'px'; ghost.style.top = (ev.clientY - 35) + 'px'; };
                            const up = (ev) => {
                                document.body.removeChild(ghost);
                                const canvas = document.getElementById('gallery-canvas');
                                const rect = canvas.getBoundingClientRect();
                                if(ev.clientY < rect.bottom && ev.clientY > rect.top) this.spawnGalleryImg(src, ev.clientX, ev.clientY);
                                document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
                            };
                            document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
                        });
                    }
                    div.oncontextmenu = (e) => { 
                        e.preventDefault(); 
                        if(confirm("パレットから削除しますか？")) {
                            const idx = this.images.indexOf(src);
                            if(idx > -1) this.images.splice(idx, 1);
                            div.remove();
                        }
                    };
                    document.getElementById(targetId).appendChild(div);
                };

                createItem('palette-list', true);
                createItem('slideshow-palette-list', false);
            },

            spawnGalleryImg(src, x, y) {
                const isVideo = src.startsWith('data:video');
                const onLoad = (wOrig, hOrig, mediaEl) => {
                    const aspect = wOrig / hOrig;
                    const w = 300, h = 300 / aspect;
                    const obj = document.createElement('div');
                    obj.className = 'art-object frame-none filter-none';
                    Object.assign(obj.style, { width: w+'px', height: h+'px', left: (x-w/2)+'px', top: (y-h/2)+'px', zIndex: this.zIndexCounter++ });
                    
                    if(!isVideo) {
                        obj.style.backgroundImage = `url(${src})`;
                    } else {
                        mediaEl.style.width = '100%'; mediaEl.style.height = '100%'; 
                        mediaEl.style.objectFit = 'cover'; mediaEl.style.pointerEvents = 'none';
                        mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true;
                        obj.appendChild(mediaEl);
                    }

                    const overlay = document.createElement('div');
                    overlay.className = 'ero-overlay'; overlay.style.display = 'none';
                    obj.appendChild(overlay);
                    
                    let lastTapTime = 0;
                    obj.addEventListener('pointerdown', (e) => {
                        const currentTime = new Date().getTime();
                        const tapLength = currentTime - lastTapTime;
                        if (tapLength < 300 && tapLength > 0) {
                            if(this.currentTool === 'PICK' || this.currentTool === 'SOLO') {
                                this.enterSolo(obj);
                                e.preventDefault();
                                return;
                            }
                        }
                        lastTapTime = currentTime;

                        if(e.button!==2 && this.currentTool === 'PICK') this.startDrag(e, obj); 
                    });

                    // Pinch zoom
                    let initialDistance = null;
                    let initialWidth = null;
                    let initialHeight = null;
                    let initialLeft = null;
                    let initialTop = null;

                    obj.addEventListener('touchstart', (e) => {
                        if (e.touches.length === 2 && this.currentTool === 'PICK') {
                            initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                            initialWidth = parseFloat(obj.style.width);
                            initialHeight = parseFloat(obj.style.height);
                            initialLeft = parseFloat(obj.style.left);
                            initialTop = parseFloat(obj.style.top);
                        }
                    }, {passive: false});

                    obj.addEventListener('touchmove', (e) => {
                        if (e.touches.length === 2 && this.currentTool === 'PICK' && initialDistance) {
                            e.preventDefault();
                            const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                            const scaleChange = currentDistance / initialDistance;
                            
                            const newWidth = initialWidth * scaleChange;
                            const newHeight = initialHeight * scaleChange;
                            const dx = (newWidth - initialWidth) / 2;
                            const dy = (newHeight - initialHeight) / 2;
                            
                            obj.style.width = newWidth + 'px';
                            obj.style.height = newHeight + 'px';
                            obj.style.left = (initialLeft - dx) + 'px';
                            obj.style.top = (initialTop - dy) + 'px';
                        }
                    }, {passive: false});

                    obj.addEventListener('touchend', (e) => {
                        if (e.touches.length < 2) {
                            initialDistance = null;
                        }
                    });

                    obj.addEventListener('wheel', (e) => {
                        if(this.currentTool !== 'PICK') return;
                        e.preventDefault();
                        const s = e.deltaY < 0 ? 1.05 : 0.95;
                        const wStr = parseFloat(obj.style.width);
                        const hStr = parseFloat(obj.style.height);
                        const nw = wStr * s;
                        const nh = hStr * s;
                        const dx = (nw - wStr) / 2;
                        const dy = (nh - hStr) / 2;
                        obj.style.width = nw+'px'; obj.style.height = nh+'px';
                        obj.style.left = (parseFloat(obj.style.left) - dx) + 'px';
                        obj.style.top = (parseFloat(obj.style.top) - dy) + 'px';
                    }, {passive: false});
                    
                    obj.oncontextmenu = (e) => { e.preventDefault(); obj.remove(); };
                    document.getElementById('gallery-canvas').appendChild(obj);
                }

                if(isVideo) {
                    const vid = document.createElement('video');
                    vid.src = src;
                    vid.onloadedmetadata = () => onLoad(vid.videoWidth, vid.videoHeight, vid);
                } else {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => onLoad(img.width, img.height, null);
                }
            },

            // --- Slideshow Logic ---
            toggleSlideshowPlay(force) {
                this.isSlidePlaying = (force !== undefined) ? force : !this.isSlidePlaying;
                const btn = document.getElementById('slideshow-play-btn');
                if (this.isSlidePlaying) {
                    if (this.images.length === 0) { this.isSlidePlaying = false; return; }
                    btn.innerText = "STOP"; 
                    btn.classList.remove('text-green-400');
                    btn.classList.add('text-red-500');
                    btn.style.color = '#ef4444';
                    btn.classList.add('active');
                    this.startSlideshowInterval();
                } else {
                    btn.innerText = "START"; 
                    btn.classList.remove('text-red-500');
                    btn.style.color = '';
                    btn.classList.add('text-green-400'); 
                    btn.classList.remove('active');
                    clearInterval(this.slideIntervalId);
                }
            },

            startSlideshowInterval() {
                clearInterval(this.slideIntervalId);
                this.showNextSlide();
                this.slideIntervalId = setInterval(() => this.showNextSlide(), this.slideParams.interval);
            },

            showNextSlide() {
                if(this.images.length === 0) return;
                const canvas = document.getElementById('slideshow-canvas');
                canvas.innerHTML = '';
                
                if(this.slideIndex >= this.images.length) this.slideIndex = 0;
                const src = this.images[this.slideIndex];
                this.slideIndex = (this.slideIndex + 1) % this.images.length;
                
                const isVideo = src.startsWith('data:video');
                const canvasRect = canvas.getBoundingClientRect();
                
                const onLoad = (wOrig, hOrig, mediaEl) => {
                    const aspect = wOrig / hOrig;
                    let w = canvasRect.width * 0.8;
                    let h = w / aspect;
                    if(h > canvasRect.height * 0.8) {
                        h = canvasRect.height * 0.8;
                        w = h * aspect;
                    }

                    const obj = document.createElement('div');
                    obj.className = `art-object ${this.slideParams.frame} ${this.slideParams.filter}`;
                    Object.assign(obj.style, {
                        width: w + 'px', height: h + 'px',
                        zIndex: 100, opacity: this.slideParams.opacity / 100,
                        position: 'relative', left: 'auto', top: 'auto',
                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                    });
                    
                    if(!isVideo) {
                        obj.style.backgroundImage = `url(${src})`;
                    } else {
                        mediaEl.style.width = '100%'; mediaEl.style.height = '100%';
                        mediaEl.style.objectFit = 'contain';
                        mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true;
                        obj.appendChild(mediaEl);
                    }

                    obj.style.setProperty('--rot', '0deg');
                    obj.style.transform = 'rotate(0deg)';

                    if (this.slideParams.animIn !== 'none') {
                        obj.classList.add(this.slideParams.animIn);
                        obj.addEventListener('animationend', (e) => {
                            if (e.animationName.startsWith('in')) obj.classList.add(this.slideParams.animLoop);
                        }, { once: true });
                    } else {
                        obj.classList.add(this.slideParams.animLoop);
                    }

                    const overlay = document.createElement('div');
                    overlay.className = 'ero-overlay';
                    const p = this.slideParams.eroDegree / 100;
                    overlay.style.backgroundColor = `rgba(255, 20, 100, ${p})`;
                    overlay.style.display = p > 0 ? 'block' : 'none';
                    obj.appendChild(overlay);

                    canvas.appendChild(obj);
                };

                if(isVideo) {
                    const vid = document.createElement('video');
                    vid.src = src;
                    vid.onloadedmetadata = () => onLoad(vid.videoWidth, vid.videoHeight, vid);
                } else {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => onLoad(img.width, img.height, null);
                }
            },

            setParam(k, v) {
                this.params[k] = parseFloat(v);
                let l = v;
                if(k === 'interval') { l += 's'; this.params.interval = v*1000; if(this.isPlaying) this.startInterval(); }
                if(k === 'opacity' || k === 'eroDegree') l += '%';
                document.getElementById(`label-${k === 'eroDegree' ? 'ero' : k}`).innerText = l;
            },

            setSlideParam(k, v) {
                this.slideParams[k] = parseFloat(v);
                let l = v;
                if(k === 'interval') { l += 's'; this.slideParams.interval = v*1000; if(this.isSlidePlaying) this.startSlideshowInterval(); }
                if(k === 'opacity' || k === 'eroDegree') l += '%';
                document.getElementById(`label-slide-${k === 'eroDegree' ? 'ero' : k}`).innerText = l;
            },

            updateSizeRange() {
                const minEl = document.getElementById('size-min');
                const maxEl = document.getElementById('size-max');
                const minVal = parseInt(minEl.value);
                const maxVal = parseInt(maxEl.value);
                this.params.sizeMin = Math.min(minVal, maxVal);
                this.params.sizeMax = Math.max(minVal, maxVal);
                document.getElementById('label-size').innerText = `${this.params.sizeMin} - ${this.params.sizeMax}`;
            },

            toggleMenu() { document.getElementById('side-menu').classList.toggle('-translate-x-full'); },
            toggleMenuSlideshow() { 
                const menu = document.getElementById('slideshow-side-menu');
                const controls = document.getElementById('slideshow-controls');
                const isClosed = menu.classList.contains('-translate-x-full');
                
                if (isClosed) {
                    menu.classList.remove('-translate-x-full');
                    controls.style.transform = 'translateX(320px)';
                } else {
                    menu.classList.add('-translate-x-full');
                    controls.style.transform = 'translateX(0)';
                }
            },
            
            togglePalette(modeName) {
                const container = document.getElementById(`${modeName}-palette-container`);
                const openBtn = document.getElementById(`${modeName}-palette-open`);
                if (container.classList.contains('translate-y-full')) {
                    container.classList.remove('translate-y-full');
                    openBtn.classList.add('hidden');
                } else {
                    container.classList.add('translate-y-full');
                    openBtn.classList.remove('hidden');
                }
            },

            setTool(t) {
                this.currentTool = t;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
                
                ['random-canvas', 'gallery-canvas'].forEach(id => {
                    const canvas = document.getElementById(id);
                    if(canvas) {
                        canvas.classList.remove('cursor-pop', 'cursor-pick', 'cursor-lock', 'cursor-solo');
                        canvas.classList.add(`cursor-${t.toLowerCase()}`);
                    }
                });
            },

            toggleFullscreen() {
                if(!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            },

            randomizeParams() {
                document.querySelectorAll('#preset-groups button').forEach(b => { if(Math.random() > 0.8) b.click(); });
            },

            clearCanvas() {
                document.getElementById('random-canvas').innerHTML = '';
                this.updateCounter();
            },

            setupCoreEvents() {
                const dropZone = document.getElementById('menu-upload');
                dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-pink-900/40'); });
                dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-pink-900/40'));
                dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('bg-pink-900/40'); this.handleFiles(e.dataTransfer.files); });

                document.addEventListener('mousedown', (e) => {
                    if(this.mode === 'RANDOM' && e.button === 1) {
                        e.preventDefault();
                        this.burstInterval = setInterval(() => {
                            const el = document.elementFromPoint(this.mx, this.my);
                            if(el && el.classList.contains('art-object') && !el.classList.contains('locked')) {
                                this.burstEffect(el, this.mx, this.my);
                            }
                        }, 50);
                    }
                });
                document.addEventListener('mouseup', (e) => { if(e.button === 1) clearInterval(this.burstInterval); });
                document.addEventListener('mousemove', (e) => { this.mx = e.clientX; this.my = e.clientY; });

                const soloViewport = document.getElementById('solo-viewport');
                soloViewport.addEventListener('wheel', (e) => {
                    if(this.mode !== 'SOLO') return;
                    e.preventDefault();
                    this.soloZoom = Math.max(0.1, this.soloZoom + (e.deltaY < 0 ? 0.1 : -0.1));
                    document.getElementById('solo-img-container').style.transform = `scale(${this.soloZoom})`;
                }, {passive: false});

                // Solo mode touch pinch zoom
                let soloInitialDist = null;
                let soloInitialZoom = null;

                soloViewport.addEventListener('touchstart', (e) => {
                    if (this.mode === 'SOLO' && e.touches.length === 2) {
                        soloInitialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        soloInitialZoom = this.soloZoom;
                        e.preventDefault();
                    }
                }, {passive: false});

                soloViewport.addEventListener('touchmove', (e) => {
                    if (this.mode === 'SOLO' && e.touches.length === 2 && soloInitialDist) {
                        e.preventDefault();
                        const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        this.soloZoom = Math.max(0.1, soloInitialZoom * (currentDist / soloInitialDist));
                        document.getElementById('solo-img-container').style.transform = `scale(${this.soloZoom})`;
                    }
                }, {passive: false});

                soloViewport.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) soloInitialDist = null;
                });

                // T Key Tool Toggle
                document.addEventListener('keydown', (e) => {
                    if(e.key.toLowerCase() === 't') {
                        const tools = ['PICK', 'LOCK', 'POP', 'SOLO'];
                        const idx = (tools.indexOf(this.currentTool) + 1) % tools.length;
                        this.setTool(tools[idx]);
                    }
                });
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
